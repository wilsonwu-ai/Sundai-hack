<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Fleet risk motion</title>
<script src="gsap.min.js"></script>
<script src="data.js"></script>
<style>
:root {
  --navy: #0A2942; --copper: #A8481B; --ink: #14212F; --paper: #F5F7FA; --surface: #FFFFFF;
  --line: #D5DCE5; --muted: #4C5A6B; --tint-navy: #E6ECF3; --tint-copper: #FBEEE3; --copper-dark: #EE9264;
  --font: "Public Sans", "Helvetica Neue", Arial, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); font-family: var(--font); }
#root { position: relative; width: 1920px; height: 1080px; background: var(--paper); color: var(--ink); overflow: hidden; }
.abs { position: absolute; }

#q { left: 80px; top: 52px; font-size: 56px; font-weight: 800; letter-spacing: -0.02em; color: var(--navy); line-height: 1.1; white-space: nowrap; transform-origin: 0 0; }
.ill { right: 80px; top: 56px; height: 52px; padding: 0 24px; border: 3px solid var(--muted); border-radius: 26px;
  font-size: 30px; font-weight: 700; letter-spacing: 0.03em; line-height: 46px; color: var(--muted); z-index: 50; background: var(--paper); }
.ill.on-navy { border-color: #A9C2E3; color: #A9C2E3; background: var(--navy); opacity: 0; }

#grid { left: 0; top: 0; width: 1920px; height: 1080px; }
.row { position: absolute; left: 80px; width: 1200px; height: 66px; }
.row .lab { position: absolute; left: 0; top: 0; line-height: 66px; font-size: 32px; font-weight: 700; color: var(--navy); white-space: nowrap; }
.row .tag { position: absolute; left: 270px; top: 14px; height: 38px; line-height: 34px; padding: 0 12px; border: 2px dashed #77859A; border-radius: 8px; font-size: 26px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.row .dots { position: absolute; left: 480px; top: 10px; height: 46px; display: flex; gap: 14px; }
.dot { width: 46px; height: 46px; border-radius: 50%; background: var(--navy); }
.row .none { position: absolute; left: 480px; top: 8px; width: 560px; height: 50px; border: 3px dashed var(--line); border-radius: 25px; line-height: 44px; padding-left: 22px; font-size: 28px; font-weight: 600; color: var(--muted); }
.row .tally { position: absolute; left: 1110px; top: 0; line-height: 66px; font-size: 30px; font-weight: 700; color: var(--muted); white-space: nowrap; opacity: 0; }
.row .tally.r { color: var(--copper); }

#counter { left: 1400px; top: 230px; width: 460px; }
#counter .big { font-size: 230px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; color: var(--navy); }
#counter .cap { margin-top: 22px; font-size: 44px; font-weight: 700; line-height: 1.2; color: var(--navy); }
#counter .cap2 { margin-top: 10px; font-size: 36px; font-weight: 600; line-height: 1.2; color: var(--muted); }

#worst { left: 0; top: 0; width: 1920px; height: 1080px; }
#whead { left: 80px; top: 150px; width: 1500px; }
#whead .kick { font-size: 36px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--copper); }
#whead .name { margin-top: 6px; display: flex; align-items: center; gap: 30px; }
#whead .bigdot { width: 76px; height: 76px; border-radius: 50%; background: var(--copper); flex: 0 0 76px; }
#whead .nm { font-size: 104px; font-weight: 800; letter-spacing: -0.03em; color: var(--navy); line-height: 1.05; }
#whead .sub { margin-top: 6px; font-size: 44px; font-weight: 600; color: var(--muted); }
#wmetric { left: 80px; top: 470px; width: 1760px; }
#wmetric .lbl { font-size: 44px; font-weight: 600; color: var(--muted); }
#wmetric .num { margin-top: 4px; font-size: 168px; font-weight: 800; letter-spacing: -0.04em; color: var(--copper); line-height: 1.05; }
#wmetric .num span { font-size: 64px; font-weight: 700; color: var(--navy); letter-spacing: -0.01em; }
#bar { left: 80px; top: 850px; width: 1760px; height: 40px; border-radius: 20px; background: var(--tint-navy); }
#bar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 20px; background: var(--copper); }
#line5 { top: 800px; width: 6px; height: 140px; background: var(--navy); border-radius: 3px; }
#line5lab { top: 744px; font-size: 40px; font-weight: 800; color: var(--navy); white-space: nowrap; }

#reasons { left: 80px; top: 430px; width: 1760px; }
.reason { position: relative; display: flex; align-items: center; gap: 30px; margin-bottom: 26px; padding: 22px 32px; min-height: 130px;
  background: var(--surface); border: 2px solid var(--line); border-left: 12px solid var(--copper); border-radius: 16px; opacity: 0; }
.reason .n { flex: 0 0 72px; height: 72px; border-radius: 50%; background: var(--tint-copper); color: var(--copper); font-size: 44px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.reason .t { font-size: 48px; font-weight: 700; letter-spacing: -0.015em; color: var(--ink); line-height: 1.2; }

#check { left: 0; top: 0; width: 1920px; height: 1080px; }
#check .k { left: 80px; top: 230px; font-size: 64px; font-weight: 800; letter-spacing: -0.02em; color: var(--navy); }
#check .bar { left: 80px; top: 200px; width: 120px; height: 10px; background: var(--copper); border-radius: 5px; }
#check .x { left: 80px; top: 360px; font-size: 300px; font-weight: 800; letter-spacing: -0.045em; line-height: 1; color: var(--navy); }
#check .x span { font-size: 120px; font-weight: 700; letter-spacing: -0.01em; color: var(--muted); }
#check .s1 { left: 80px; top: 720px; font-size: 52px; font-weight: 700; color: var(--navy); }
#check .s2 { left: 80px; top: 800px; font-size: 44px; font-weight: 600; color: var(--muted); }

#end { left: 0; top: 0; width: 1920px; height: 1080px; background: var(--navy); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 200px; }
#end .brandbar { width: 140px; height: 10px; background: var(--copper-dark); border-radius: 5px; margin-bottom: 60px; }
#end h1 { font-size: 128px; font-weight: 800; letter-spacing: -0.03em; color: #fff; line-height: 1.08; }
</style>
</head>
<body>
<div id="root">
  <div id="q" class="abs">What share of our agents is risky?</div>

  <div id="grid" class="abs"></div>
  <div id="counter" class="abs">
    <div class="big" id="cbig">0%</div>
    <div class="cap" id="ccap"></div>
    <div class="cap2" id="ccap2"></div>
  </div>

  <div id="worst" class="abs">
    <div id="whead" class="abs">
      <div class="kick">Worst agent</div>
      <div class="name"><div class="bigdot"></div><div class="nm" id="wname"></div></div>
      <div class="sub" id="wsub"></div>
    </div>
    <div id="wmetric" class="abs">
      <div class="lbl">Paused sessions</div>
      <div class="num"><b id="wp" style="font-weight:800">0</b> <span id="wof"></span></div>
    </div>
    <div id="bar" class="abs"><div class="fill" id="wfill"></div></div>
    <div id="line5" class="abs"></div>
    <div id="line5lab" class="abs">5% budget</div>
    <div id="reasons" class="abs"></div>
  </div>

  <div id="check" class="abs">
    <div class="bar abs"></div>
    <div class="k abs">Checked against sealed answers</div>
    <div class="x abs"><b id="cx" style="font-weight:800"></b> <span id="cof"></span></div>
    <div class="s1 abs" id="cs1"></div>
    <div class="s2 abs" id="cs2"></div>
  </div>

  <div id="end" class="abs">
    <div class="brandbar"></div>
    <h1>Catch the risky move before the money moves.</h1>
  </div>

  <div id="ill" class="abs ill">Illustrative sample</div>
  <div id="ill2" class="abs ill on-navy">Illustrative sample</div>
</div>
<script src="motion.js"></script>
</body>
</html>
